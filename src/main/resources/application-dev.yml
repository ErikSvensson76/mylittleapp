spring:
  application:
    name: mylittleapp
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: HikariCP
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB
server:
  port: 8080
  servlet:
    context-path: '/api'
management:
  endpoints:
    web:
      exposure:
        include: health
base:
  url: ${BASE_URL}